# SPDX-License-Identifier: MPL-2.0
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
