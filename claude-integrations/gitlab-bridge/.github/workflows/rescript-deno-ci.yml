# SPDX-License-Identifier: MPL-2.0
name: / CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: denoland/setup-@v2
        with:
          -version: v1.x
      - name:  lint
        run:  lint
      - name:  fmt check
        run:  fmt --check
      - name:  test
        run:  test --allow-all --coverage=coverage
      - name:  build
        run: |
          if [ -f ".json" ] || [ -f "bsconfig.json" ]; then
            npm install
            npx 
          fi
      - name: Type check
        run:  check **/*.ts || true
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: denoland/setup-@v2
      - name: Check permissions
        run: |
          # Audit for dangerous permissions
          grep -rE "allow-run|allow-write|allow-env" . || echo "No dangerous permissions"
