name: Semgrep SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Semgrep
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --sarif --output=semgrep.sarif --config=auto .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: semgrep.sarif
        if: always()
