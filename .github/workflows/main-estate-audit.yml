name: Central Estate CI/CD Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  estate-audit:
    runs-on: ubuntu-latest
    steps:



      - uses: actions/checkout@v7.0.1

      
      - name: Required Files Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/required-files-check@main
        
      - name: Code Hygiene Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/code-hygiene-check@main
        
      - name: Manifest Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/manifest-check@main
        
      - name: Idris2 ABI Purity Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/idris2-abi-check@main
        
      - name: Zig UnifiedApiAdapter API Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/zig-unified-api-adapter-check@main
        
      - name: Contractile Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/contractile-validation-check@main
        
      - name: Recipes Set Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/recipes-set-check@main
        
      - name: Affirmation Document Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/affirmation-check@main
        
      - name: Academic Referencing Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/referencing-check@main
        
      - name: Semantic Audit Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/semantic-audit-check@main
        
      - name: SPDX License Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/spdx-license-check@main
        
      - name: Proof Runner Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/proof-runner-check@main
        
      - name: PRAT Testing Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/prat-check@main
        
      - name: Panic Attack & Pons Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/custom-tools-check@main
        
      - name: WWW & Well-Known Compliance Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/www-compliance-check@main
        
      - name: BoJ Cartridge Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/boj-cartridge-check@main
        
      - name: Formatting Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/formatting-check@main
        
      - name: Accreditations & Badges Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/badges-check@main
        
      - name: Metrics Extraction Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/metrics-check@main
        
      - name: Linguist & Banned Languages Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/linguist-check@main
        
      - name: Test & Benchmarks Dashboard Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/tests-benches-check@main
        
      - name: Hosting & Site Status Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/hosting-check@main
        
      - name: Git-Sea Analytics Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/gitsea-check@main
        
      - name: Trust & Humans Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/trust-humans-check@main
        
      - name: Are We UnAPI Gate (Secret Scanning)
        uses: hyperpolymath/proven-cicd-and-workflows/actions/secrets-check@main
        
      - name: Reasonably Good Token Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/vaulted-tokens-check@main
